name: Sync event photos from Google Drive

on:
  schedule:
    - cron: '0 19 * * *'   # 每天 19:00 UTC = 台灣時間 03:00
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Sync photo list from Google Drive
        env:
          GDRIVE_API_KEY: ${{ secrets.GDRIVE_API_KEY }}
        run: node scripts/sync-event-photos.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add event-photos-data.js
          git diff --staged --quiet || git commit -m "[CHORE] auto-sync event photos from Google Drive"
          git push

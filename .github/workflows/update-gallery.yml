name: Update delivery gallery index

on:
  push:
    paths:
      - 'fig/delivery/**'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate delivery-data.js
        run: |
          node - <<'EOF'
          const fs   = require('fs');
          const path = require('path');

          const dir  = 'fig/delivery';
          const exts = new Set(['.jpg', '.jpeg', '.png', '.webp', '.gif']);

          const files = fs.existsSync(dir)
            ? fs.readdirSync(dir)
                .filter(f => exts.has(path.extname(f).toLowerCase()))
                .sort()
            : [];

          const lines = files.map(f => `    'fig/delivery/${f}',`).join('\n');

          const content =
`// ══════════════════════════════════════════════════════════════════════════════
//  交車照片牆資料檔（由 GitHub Actions 自動產生，請勿手動編輯）
//  新增照片：將圖片放入 fig/delivery/ 後 commit & push，CI 會自動更新此檔
// ══════════════════════════════════════════════════════════════════════════════

const DELIVERY_PHOTOS = [
${lines}
];
`;

          fs.writeFileSync('delivery-data.js', content, 'utf8');
          console.log(`Updated delivery-data.js — ${files.length} photo(s)`);
          EOF

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add delivery-data.js
          git diff --staged --quiet || git commit -m "[CHORE] auto-update delivery gallery index"
          git push
